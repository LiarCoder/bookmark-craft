<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小书签管理器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .status {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: center;
    }

    .status.loading {
      color: #6c757d;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .bookmarklets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .bookmarklet-card {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .bookmarklet-card:hover {
      border-color: #4facfe;
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.2);
    }

    .bookmarklet-card:active {
      cursor: grabbing;
    }

    .bookmarklet-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bookmarklet-execute {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      display: inline-block;
      text-wrap: nowrap;
      border-radius: 6px;
      cursor: pointer;
    }

    .bookmarklet-link {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      word-break: break-all;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: grab;
    }

    .bookmarklet-link:hover {
      background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
    }

    .drag-hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #6c757d;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #495057;
    }

    .empty-state p {
      font-size: 1rem;
      line-height: 1.6;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .refresh-btn:hover {
      background: linear-gradient(135deg, #3d8bfe 0%, #00d4fe 100%);
      transform: translateY(-1px);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #6c757d;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc3545;
      animation: pulse 2s infinite;
    }

    .status-indicator.connected {
      background: #28a745;
      animation: none;
    }

    .status-indicator.connecting {
      background: #ffc107;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .content {
        padding: 20px;
      }

      .bookmarklets-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>小书签管理器</h1>
      <p>拖拽下方的小书签到浏览器书签栏即可使用</p>
    </div>

    <div class="content">
      <div id="status" class="status loading">
        正在加载小书签列表...
      </div>

      <div class="controls">
        <button id="refresh-btn" class="refresh-btn" onclick="loadBookmarklets()">
          刷新列表
        </button>
        <div id="connection-status" class="connection-status">
          <span class="status-indicator"></span>
          <span class="status-text">连接中...</span>
        </div>
      </div>

      <div id="bookmarklets-list" class="bookmarklets-grid">
        <!-- 小书签列表将在这里动态生成 -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <h3>暂无小书签</h3>
        <p>请在 <code>src/bookmarklets/</code> 目录中创建 JavaScript 文件，<br>
          然后运行构建命令生成小书签。</p>
      </div>
    </div>
  </div>

  <script>
    // 全局变量
    let bookmarklets = [];

    /**
     * 从服务器加载小书签列表
     */
    async function loadBookmarklets() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('bookmarklets-list');
      const emptyStateEl = document.getElementById('empty-state');

      // 显示加载状态
      statusEl.className = 'status loading';
      statusEl.textContent = '正在加载小书签列表...';
      listEl.innerHTML = '';
      emptyStateEl.style.display = 'none';

      try {
        const response = await fetch('/api/bookmarklets');

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        bookmarklets = await response.json();

        if (bookmarklets.length === 0) {
          // 显示空状态
          statusEl.style.display = 'none';
          emptyStateEl.style.display = 'block';
        } else {
          // 显示成功状态
          statusEl.className = 'status success';
          statusEl.textContent = `成功加载 ${bookmarklets.length} 个小书签`;

          // 渲染小书签列表
          renderBookmarklets();
        }

      } catch (error) {
        console.error('加载小书签失败:', error);
        statusEl.className = 'status error';
        statusEl.textContent = `加载失败: ${error.message}`;
        emptyStateEl.style.display = 'none';
      }
    }

    /**
     * 渲染小书签列表到页面
     */
    function renderBookmarklets() {
      const listEl = document.getElementById('bookmarklets-list');

      listEl.innerHTML = bookmarklets.map(bookmarklet => {
        const displayName = formatBookmarkletName(bookmarklet.name);

        return `
                    <div class="bookmarklet-card" data-content="${escapeHtml(bookmarklet.content)}">
                        <div class="bookmarklet-content">
                            <a href="${escapeHtml(bookmarklet.content)}" 
                              class="bookmarklet-link"
                              onclick="return false;">
                                ${escapeHtml(displayName)}
                            </a>
                            <button class="bookmarklet-execute" onclick="${escapeHtml(bookmarklet.content.replace('javascript:', ''))}">执行</button>
                        </div>
                        <div class="drag-hint">
                            ☝ 拖拽链接到书签栏 💡
                        </div>
                    </div>
                `;
      }).join('');
    }

    /**
     * 格式化小书签名称，使其更易读
     */
    function formatBookmarkletName(filename) {
      return filename
        .replace(/[-_]/g, ' ')  // 将连字符和下划线替换为空格
        .replace(/\b\w/g, l => l.toUpperCase());  // 首字母大写
    }

    /**
     * HTML 转义函数，防止 XSS
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**
     * 页面加载完成后自动加载小书签列表并启动实时更新
     */
    document.addEventListener('DOMContentLoaded', () => {
      console.log('小书签管理器界面已加载');
      loadBookmarklets();

      // 启动实时更新功能
      setupRealTimeUpdates();
    });

    /**
     * 实时更新功能 - 使用 Server-Sent Events (SSE)
     */
    let eventSource = null;

    function setupRealTimeUpdates() {
      // 如果已经有连接，先关闭
      if (eventSource) {
        eventSource.close();
      }

      updateConnectionStatus('connecting', '连接中...');

      try {
        eventSource = new EventSource('/api/events');

        eventSource.onopen = function (event) {
          console.log('SSE 连接已建立');
          updateConnectionStatus('connected', '实时更新已启用');
        };

        eventSource.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            handleRealTimeUpdate(data);
          } catch (error) {
            console.error('解析 SSE 消息失败:', error);
          }
        };

        eventSource.onerror = function (event) {
          console.error('SSE 连接错误:', event);
          updateConnectionStatus('disconnected', '连接断开');

          // 连接断开后尝试重连
          setTimeout(() => {
            console.log('尝试重新连接 SSE...');
            setupRealTimeUpdates();
          }, 3000);
        };

      } catch (error) {
        console.error('设置 SSE 连接失败:', error);
        updateConnectionStatus('disconnected', '实时更新不可用');
        // 如果 SSE 不支持，回退到定期轮询
        startPolling();
      }
    }

    function updateConnectionStatus(status, text) {
      const indicator = document.querySelector('.status-indicator');
      const statusText = document.querySelector('.status-text');

      if (indicator && statusText) {
        // 移除所有状态类
        indicator.className = 'status-indicator';

        // 添加新的状态类
        if (status === 'connected') {
          indicator.classList.add('connected');
        } else if (status === 'connecting') {
          indicator.classList.add('connecting');
        }

        statusText.textContent = text;
      }
    }

    function handleRealTimeUpdate(data) {
      const statusEl = document.getElementById('status');

      switch (data.type) {
        case 'connected':
          console.log('实时更新服务已连接');
          break;

        case 'build_complete':
          console.log('收到构建完成通知，刷新列表');
          // 自动刷新小书签列表
          loadBookmarklets();
          break;

        case 'build_error':
          console.error('构建失败:', data.message);
          statusEl.className = 'status error';
          statusEl.textContent = data.message;
          break;

        default:
          console.log('收到未知类型的更新:', data);
      }
    }

    /**
     * 备用方案：定期轮询更新
     */
    let pollingInterval = null;

    function startPolling(intervalMs = 5000) {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }

      console.log('启动定期轮询更新');
      updateConnectionStatus('connecting', '定期轮询模式');

      pollingInterval = setInterval(() => {
        loadBookmarklets();
      }, intervalMs);
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    /**
     * 清理资源
     */
    function cleanup() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      stopPolling();
    }

    // 页面卸载时清理资源
    window.addEventListener('beforeunload', cleanup);
  </script>
</body>

</html>
