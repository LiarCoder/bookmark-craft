<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookmarkCraft - 小书签制作工具</title>
  <style>
    :root {
      --canvas: #edf1ee;
      --surface: #fafbf9;
      --surface-strong: #ffffff;
      --ink: #17211d;
      --muted: #68736d;
      --line: #cfd7d2;
      --line-strong: #aeb9b3;
      --accent: #245d4b;
      --accent-dark: #194536;
      --signal: #dfff78;
      --danger: #a83e38;
      --warning: #a66a1f;
      --display-font: "Arial Narrow", "Aptos Narrow", "Roboto Condensed", sans-serif;
      --body-font: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
      --mono-font: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--body-font);
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 33, 29, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 29, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 32px 32px;
      min-height: 100vh;
      padding: clamp(20px, 5vw, 64px) 20px;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .workspace {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: clamp(32px, 7vw, 96px);
      align-items: end;
      padding: clamp(32px, 6vw, 72px) 0 clamp(36px, 6vw, 64px);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--muted);
      font-family: var(--mono-font);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: var(--surface);
      background: var(--ink);
      border-radius: 4px;
      letter-spacing: -0.06em;
    }

    .hero h1 {
      max-width: 720px;
      font-family: var(--display-font);
      font-size: clamp(4rem, 11vw, 8.5rem);
      font-stretch: condensed;
      font-weight: 800;
      letter-spacing: -0.075em;
      line-height: 0.76;
    }

    .hero h1 span {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--ink);
    }

    .hero-copy {
      max-width: 520px;
      margin-top: 26px;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.15rem);
      line-height: 1.65;
    }

    .install-rail {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--ink);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .protocol {
      display: inline-block;
      padding: 4px 8px;
      color: var(--ink);
      background: var(--signal);
      font-family: var(--mono-font);
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .rail-copy {
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .rail-flow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      color: var(--ink);
      font-family: var(--mono-font);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .rail-line {
      position: relative;
      flex: 1;
      height: 1px;
      background: var(--ink);
    }

    .rail-line::after {
      position: absolute;
      top: -3px;
      right: 0;
      width: 7px;
      height: 7px;
      content: "";
      background: var(--ink);
      border-radius: 50%;
    }

    .library {
      padding: clamp(40px, 6vw, 72px) 0 24px;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    .library-title .eyebrow {
      margin-bottom: 8px;
    }

    .library-title h2 {
      font-family: var(--display-font);
      font-size: clamp(2rem, 4vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-family: var(--mono-font);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background: var(--danger);
      border-radius: 50%;
    }

    .status-indicator.connected {
      background: var(--accent);
    }

    .status-indicator.connecting {
      background: var(--warning);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .refresh-btn {
      min-height: 40px;
      padding: 0 16px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      cursor: pointer;
      font: 600 0.78rem var(--mono-font);
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .refresh-btn:hover {
      background: var(--surface-strong);
      border-color: var(--ink);
    }

    .status {
      min-height: 40px;
      margin-bottom: 18px;
      padding: 10px 14px;
      color: var(--muted);
      background: rgba(250, 251, 249, 0.7);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: 0.78rem/1.45 var(--mono-font);
    }

    .status::before {
      margin-right: 8px;
      content: "●";
      color: var(--line-strong);
    }

    .status.success::before {
      color: var(--accent);
    }

    .status.error {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
    }

    .status.error::before {
      color: var(--danger);
    }

    .bookmarklets-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .bookmarklet-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .bookmarklet-card:hover {
      transform: translateY(-2px);
      border-color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .bookmarklet-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .bookmarklet-name {
      font-family: var(--display-font);
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .bookmarklet-type {
      padding: 4px 6px;
      color: var(--accent-dark);
      background: color-mix(in srgb, var(--signal) 48%, transparent);
      border-radius: 4px;
      font: 700 0.66rem var(--mono-font);
      letter-spacing: 0.08em;
    }

    .bookmarklet-file {
      margin-top: 10px;
      color: var(--muted);
      font: 0.75rem var(--mono-font);
      overflow-wrap: anywhere;
    }

    .bookmarklet-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      margin-top: auto;
      padding-top: 32px;
    }

    .bookmarklet-link,
    .bookmarklet-execute,
    .bookmarklet-copy {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 6px;
      cursor: pointer;
      font: 700 0.78rem var(--mono-font);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .bookmarklet-link {
      color: var(--surface-strong);
      background: var(--accent);
      border: 1px solid var(--accent);
      cursor: grab;
    }

    .bookmarklet-link::before {
      margin-right: 8px;
      content: "↗";
      font-size: 1rem;
    }

    .bookmarklet-link:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .bookmarklet-execute,
    .bookmarklet-copy {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line-strong);
    }

    .bookmarklet-execute:hover,
    .bookmarklet-copy:hover {
      background: var(--surface-strong);
      border-color: var(--ink);
    }

    .drag-hint {
      margin-top: 12px;
      color: var(--muted);
      font: 0.7rem/1.5 var(--mono-font);
    }

    .empty-state {
      padding: clamp(56px, 10vw, 100px) 24px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      text-align: center;
    }

    .empty-state h3 {
      margin-bottom: 10px;
      color: var(--ink);
      font-family: var(--display-font);
      font-size: 2rem;
      font-weight: 800;
    }

    .empty-state p {
      line-height: 1.7;
    }

    .empty-state code {
      padding: 2px 5px;
      color: var(--accent-dark);
      background: color-mix(in srgb, var(--signal) 48%, transparent);
      font-family: var(--mono-font);
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 0.68rem var(--mono-font);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    @media (max-width: 768px) {
      body {
        padding-top: 20px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .bookmarklets-grid {
        grid-template-columns: 1fr;
      }

      .library-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        width: 100%;
        justify-content: space-between;
      }

      .bookmarklet-card {
        min-height: 210px;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: clamp(3.65rem, 22vw, 5.5rem);
      }

      .install-rail {
        box-shadow: 5px 5px 0 var(--ink);
      }

      .bookmarklet-actions {
        grid-template-columns: 1fr 1fr;
      }

      .bookmarklet-link {
        grid-column: 1 / -1;
      }

      .page-footer {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="workspace">
    <header class="hero">
      <div>
        <p class="eyebrow"><span class="brand-mark">BC</span> Local bookmarklet workbench</p>
        <h1>Bookmark<br><span>Craft</span></h1>
        <p class="hero-copy">把常用脚本收进浏览器书签栏。无需安装扩展，拖过去，随时调用。</p>
      </div>

      <aside class="install-rail" aria-label="安装提示">
        <code class="protocol">javascript:</code>
        <p class="rail-copy">小书签本质上是一段以 JavaScript 协议开头的浏览器动作。</p>
        <div class="rail-flow" aria-hidden="true">
          <span>按住拖拽</span>
          <span class="rail-line"></span>
          <span>书签栏</span>
        </div>
      </aside>
    </header>

    <section class="library" aria-labelledby="library-title">
      <div class="library-header">
        <div class="library-title">
          <p class="eyebrow">Library / <span id="bookmarklet-count">--</span></p>
          <h2 id="library-title">可用小书签</h2>
        </div>

        <div class="controls">
          <div id="connection-status" class="connection-status">
            <span class="status-indicator"></span>
            <span class="status-text">连接中...</span>
          </div>
          <button id="refresh-btn" class="refresh-btn" type="button">
            重新载入
          </button>
        </div>
      </div>

      <div id="status" class="status loading" role="status" aria-live="polite">
        正在加载小书签列表...
      </div>

      <div id="bookmarklets-list" class="bookmarklets-grid">
        <!-- 小书签列表将在这里动态生成 -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <h3>暂无小书签</h3>
        <p>请在 <code>src/bookmarklets/</code> 目录中创建 JavaScript 文件，<br>
          然后运行构建命令生成小书签。</p>
      </div>
    </section>

    <footer class="page-footer">
      <span>BookmarkCraft / Local only</span>
      <span>Drag · Run · Copy</span>
    </footer>
  </main>

  <script>
    // 全局变量
    let bookmarklets = [];

    /**
     * 从服务器加载小书签列表
     */
    async function loadBookmarklets() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('bookmarklets-list');
      const emptyStateEl = document.getElementById('empty-state');
      const countEl = document.getElementById('bookmarklet-count');

      // 显示加载状态
      statusEl.className = 'status loading';
      statusEl.textContent = '正在加载小书签列表...';
      statusEl.style.display = 'block';
      listEl.replaceChildren();
      emptyStateEl.style.display = 'none';

      try {
        const response = await fetch('/api/bookmarklets', { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        bookmarklets = await response.json();

        if (!Array.isArray(bookmarklets)) {
          throw new Error('服务器返回了无效数据');
        }

        countEl.textContent = String(bookmarklets.length).padStart(2, '0');

        if (bookmarklets.length === 0) {
          // 显示空状态
          statusEl.style.display = 'none';
          emptyStateEl.style.display = 'block';
        } else {
          // 显示成功状态
          statusEl.className = 'status success';
          statusEl.textContent = `成功加载 ${bookmarklets.length} 个小书签`;

          // 渲染小书签列表
          renderBookmarklets();
        }

      } catch (error) {
        console.error('加载小书签失败:', error);
        countEl.textContent = '--';
        statusEl.className = 'status error';
        statusEl.textContent = `加载失败: ${error.message}`;
        emptyStateEl.style.display = 'none';
      }
    }

    // 创建元素函数
    const createElement = ({
      parent = null,
      tagName = "div",
      text = "",
      attributes = {},
      events = {},
      children = [],
    }) => {
      const element = document.createElement(tagName);
      element.textContent = text;
      Object.keys(attributes).forEach((key) =>
        element.setAttribute(key, attributes[key])
      );
      Object.entries(events).forEach(([eventName, listener]) =>
        element.addEventListener(eventName, listener)
      );
      if (parent) {
        parent.appendChild(element);
      }
      if (children && children.length > 0) {
        children.forEach(child => {
          element.appendChild(child);
        });
      }
      return element;
    };

    /**
     * 渲染小书签列表到页面
     */
    function renderBookmarklets() {
      const listEl = document.getElementById('bookmarklets-list');
      // 使用文档片段批量创建元素
      const fragment = document.createDocumentFragment();

      bookmarklets.forEach(bookmarklet => {
        createElement({
          parent: fragment,
          tagName: "article",
          attributes: {
            class: "bookmarklet-card"
          },
          children: [
            createElement({
              tagName: "div",
              attributes: {
                class: "bookmarklet-meta"
              },
              children: [
                createElement({
                  tagName: "h3",
                  attributes: {
                    title: bookmarklet.chineseName,
                    class: "bookmarklet-name"
                  },
                  text: bookmarklet.chineseName
                }),
                createElement({
                  tagName: "span",
                  attributes: {
                    class: "bookmarklet-type"
                  },
                  text: "JS"
                })
              ]
            }),
            createElement({
              tagName: "code",
              attributes: {
                class: "bookmarklet-file"
              },
              text: `${bookmarklet.name}.js`
            }),
            createElement({
              tagName: "div",
              attributes: {
                class: "bookmarklet-actions"
              },
              children: [
                createElement({
                  tagName: "a",
                  attributes: {
                    href: bookmarklet.content,
                    class: "bookmarklet-link",
                    title: `拖拽安装 ${bookmarklet.chineseName}`
                  },
                  events: {
                    click: event => event.preventDefault()
                  },
                  text: "拖拽安装"
                }),
                createElement({
                  tagName: "button",
                  attributes: {
                    class: "bookmarklet-execute",
                    type: "button"
                  },
                  events: {
                    click: () => executeBookmarklet(bookmarklet.content)
                  },
                  text: "运行"
                }),
                createElement({
                  tagName: "button",
                  attributes: {
                    class: "bookmarklet-copy",
                    type: "button"
                  },
                  events: {
                    click: event => copyToClipboard(bookmarklet.content, event.currentTarget)
                  },
                  text: "复制"
                })
              ]
            }),
            createElement({
              tagName: "div",
              attributes: {
                class: "drag-hint",
              },
              text: "将绿色按钮拖入浏览器书签栏即可安装"
            })
          ]
        });

      });

      listEl.appendChild(fragment);
    }

    function executeBookmarklet(content) {
      if (!content.startsWith('javascript:')) {
        alert('无效的小书签内容');
        return;
      }

      window.location.href = content;
    }

    /**
     * 复制文本到剪贴板
     */
    async function copyToClipboard(content, button) {
      const originalText = button.textContent;

      try {
        await navigator.clipboard.writeText(content);
        button.textContent = '已复制';
      } catch (error) {
        console.error('复制失败:', error);
        button.textContent = '复制失败';
      }

      setTimeout(() => {
        button.textContent = originalText;
      }, 1500);
    }

    /**
     * 页面加载完成后自动加载小书签列表并启动实时更新
     */
    document.addEventListener('DOMContentLoaded', () => {
      console.log('小书签管理器界面已加载');
      document.getElementById('refresh-btn').addEventListener('click', loadBookmarklets);
      loadBookmarklets();

      // 启动实时更新功能
      setupRealTimeUpdates();
    });

    /**
     * 实时更新功能 - 使用 Server-Sent Events (SSE)
     */
    let eventSource = null;

    function setupRealTimeUpdates() {
      // 如果已经有连接，先关闭
      if (eventSource) {
        eventSource.close();
      }

      updateConnectionStatus('connecting', '连接中...');

      if (!('EventSource' in window)) {
        startPolling();
        return;
      }

      try {
        eventSource = new EventSource('/api/events');

        eventSource.onopen = function (event) {
          console.log('SSE 连接已建立');
          updateConnectionStatus('connected', '实时更新已启用');
        };

        eventSource.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            handleRealTimeUpdate(data);
          } catch (error) {
            console.error('解析 SSE 消息失败:', error);
          }
        };

        eventSource.onerror = function (event) {
          console.error('SSE 连接错误:', event);
          updateConnectionStatus('connecting', '连接中断，正在重连...');
        };

      } catch (error) {
        console.error('设置 SSE 连接失败:', error);
        updateConnectionStatus('disconnected', '实时更新不可用');
        // 如果 SSE 不支持，回退到定期轮询
        startPolling();
      }
    }

    function updateConnectionStatus(status, text) {
      const indicator = document.querySelector('.status-indicator');
      const statusText = document.querySelector('.status-text');

      if (indicator && statusText) {
        // 移除所有状态类
        indicator.className = 'status-indicator';

        // 添加新的状态类
        if (status === 'connected') {
          indicator.classList.add('connected');
        } else if (status === 'connecting') {
          indicator.classList.add('connecting');
        }

        statusText.textContent = text;
      }
    }

    function handleRealTimeUpdate(data) {
      const statusEl = document.getElementById('status');

      switch (data.type) {
        case 'connected':
          console.log('实时更新服务已连接');
          break;

        case 'build_complete':
          console.log('收到构建完成通知，刷新列表');
          // 自动刷新小书签列表
          loadBookmarklets();
          break;

        case 'build_start':
        case 'build_queued':
          statusEl.style.display = 'block';
          statusEl.className = 'status loading';
          statusEl.textContent = data.message;
          break;

        case 'build_error':
          console.error('构建失败:', data.message);
          statusEl.className = 'status error';
          statusEl.textContent = data.message;
          break;

        default:
          console.log('收到未知类型的更新:', data);
      }
    }

    /**
     * 备用方案：定期轮询更新
     */
    let pollingInterval = null;

    function startPolling(intervalMs = 5000) {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }

      console.log('启动定期轮询更新');
      updateConnectionStatus('connecting', '定期轮询模式');

      pollingInterval = setInterval(() => {
        loadBookmarklets();
      }, intervalMs);
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    /**
     * 清理资源
     */
    function cleanup() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      stopPolling();
    }

    // 页面卸载时清理资源
    window.addEventListener('beforeunload', cleanup);
  </script>
</body>

</html>
